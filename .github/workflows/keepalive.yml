name: Keepalive

on:
  schedule:
    # Every 2 days at 15:00 UTC. Free-tier projects pause after about a week idle.
    - cron: '0 15 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [production, staging]
    steps:
      - name: GET /rest/v1/rpc/health
        env:
          SUPABASE_URL: ${{ matrix.target == 'production' && secrets.VITE_SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ matrix.target == 'production' && secrets.VITE_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "${TARGET}: missing URL or anon key"
            exit 1
          fi
          code="$(curl -sS -o /tmp/health-body -w '%{http_code}' \
            --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/rpc/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json")"
          echo "${TARGET} status ${code}"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "${TARGET} health check failed"
            exit 1
          fi
