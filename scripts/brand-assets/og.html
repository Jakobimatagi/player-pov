<!doctype html>
<!--
  The link-share image (public/landing/og.png), 1200x630. Rendered by render.mjs, which fills the
  [data-brand] elements from src/lib/brand.ts. Open it straight in Chrome to tweak the layout.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Big Shoulders Display';
        src: url('../../node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist';
        src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      :root {
        --navy: #0b1220;
        --navy-2: #131d31;
        --orange: #ff7a1f;
        --chalk: #f4f6fa;
        --muted: #aab4c6;
        --gold: #f2c94c;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(900px 500px at 85% 20%, rgba(255, 122, 31, 0.18), transparent 60%),
          linear-gradient(160deg, var(--navy-2), var(--navy) 55%);
        color: var(--chalk);
        font-family: 'Geist', sans-serif;
      }
      /* Faint yard lines across the background. */
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.035) 0 2px,
          transparent 2px 120px
        );
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 84px;
        width: 620px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .brand img {
        width: 96px;
        height: 96px;
      }
      .wordmark {
        font-family: 'Big Shoulders Display', sans-serif;
        font-weight: 800;
        font-size: 100px;
        line-height: 0.9;
        white-space: nowrap;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .wordmark .accent {
        color: var(--orange);
      }
      .tagline {
        margin-top: 64px;
        font-family: 'Big Shoulders Display', sans-serif;
        font-weight: 800;
        font-size: 82px;
        line-height: 0.98;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }
      .tagline span {
        display: block;
      }
      .tagline span:last-child {
        color: var(--gold);
      }
      .url {
        position: absolute;
        left: 72px;
        bottom: 54px;
        font-size: 30px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.01em;
      }
      .shot {
        position: absolute;
        left: 700px;
        top: 120px;
        width: 640px;
        height: 400px;
        border-radius: 22px;
        overflow: hidden;
        border: 4px solid var(--orange);
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.55),
          0 0 0 10px rgba(255, 122, 31, 0.12);
        transform: rotate(-3deg);
      }
      .shot img {
        position: absolute;
        /* Crop the source (1280x800) to the players at the line, above the replay controls. */
        width: 1280px;
        left: -230px;
        top: -215px;
      }
      .pill {
        position: absolute;
        left: 24px;
        top: 22px;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--orange);
        color: #1a0d02;
        font-weight: 700;
        font-size: 24px;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12px;
        background: var(--orange);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <img src="../../public/favicon.svg" alt="" />
        <div class="wordmark">
          <span data-brand="lead">Scheme</span> <span class="accent" data-brand="accent">HQ</span>
        </div>
      </div>
      <p class="tagline" data-brand="tagline">
        <span>Install it.</span><span>Learn it.</span><span>Win Friday.</span>
      </p>
    </div>
    <div class="url" data-brand="host">schemehq.app</div>
    <div class="shot">
      <img src="../../public/landing/pov.webp" alt="" />
      <div class="pill">Every player learns it in 3D</div>
    </div>
    <div class="bar"></div>
  </body>
</html>
